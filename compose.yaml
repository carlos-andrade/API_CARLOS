# ID: API-CARLOS-SRC-COMPOSE-YAML
# Projeto: API_CARLOS | Repositório: https://github.com/carlos-andrade/API_CARLOS
# Tipo documental: CONFIGURAÇÃO DE COMPOSIÇÃO | Fase: G2 — Segurança de rede | Estado: EM_REVISAO
# Versão: 0.2.0 | Data de atualização: 2026-10-24 | Responsável: Carlos Andrade
# Aprovador: Pendente de revisão independente
# Origem: Isolamento da API através de proxy de saída dedicado
# Autoridade superior: https://github.com/carlos-andrade/GOVERNANCA/blob/main/CABE%C3%87ALHO/NORMA-CABECALHO-PADRAO.md
# Cadeia de autoridade: PROMPTS → CARTAS → LAYOUT ÚNICO → CÓDIGO

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      AUDIT_DB_PATH: /data/audit.sqlite3
      EGRESS_PROXY_URL: http://egress-proxy:3128
    volumes:
      - audit-data:/data
    networks:
      - api_internal
    depends_on:
      egress-proxy:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  egress-proxy:
    build: ./proxy
    expose:
      - "3128"
    networks:
      - api_internal
      - proxy_egress
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

networks:
  api_internal:
    internal: true
  proxy_egress:

volumes:
  audit-data:
