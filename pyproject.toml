[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "api-carlos"
version = "0.1.0"
description = "API modular para extração segura de dados públicos da Internet"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5,<7", "ruff>=0.7,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
